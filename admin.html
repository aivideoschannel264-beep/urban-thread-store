
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URBAN THREAD - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f3f3f3;margin:0;color:#222}
header{background:#111;color:white;padding:20px;text-align:center}
main{max-width:750px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;margin-bottom:18px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:5px}
button{background:#111;color:white;border:0;padding:12px 18px;border-radius:5px;cursor:pointer;margin:5px}
.danger{background:#b42318}
.hidden{display:none}
.item{border-bottom:1px solid #ddd;padding:12px 0}
</style>
</head>
<body>
<header>
<h1>URBAN THREAD</h1>
<p>ADMIN DASHBOARD</p>
</header>

<main>
<div class="card" id="login">
<h2>Admin Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p id="loginMessage"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Welcome Admin</h2>
<button id="logout">Logout</button>
</div>

<div class="card">
<h2>Add Product</h2>
<form id="productForm">
<input id="productName" placeholder="Product Name" required>
<textarea id="description" placeholder="Description"></textarea>
<input id="price" type="number" min="1" placeholder="Price in Rs." required>
<input id="image" type="url" placeholder="Image URL (https://...)">
<button type="submit">Add Product</button>
</form>
<p id="productMessage"></p>
</div>

<div class="card">
<h2>Manage Products</h2>
<div id="productList">Loading...</div>
</div>

<div class="card">
<h2>Customer Orders</h2>
<div id="orderList">Loading...</div>
</div>
</div>
</main>

<script>
const URL = "https://afwikvilbmgmwjcwamzx.supabase.co";
const KEY = "sb_publishable_FIpEBKTrSW_j3XhTvNIHHQ_pdX8U3AV";
const db = window.supabase.createClient(URL,KEY);

const $ = id => document.getElementById(id);

function safe(text){
 return String(text ?? '').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

async function checkAdmin(){
 const {data:{session}} = await db.auth.getSession();
 if(!session){showLogin();return;}
 const {data,error} = await db.from('admins')
   .select('user_id').eq('user_id',session.user.id).maybeSingle();

 if(error || !data){
   await db.auth.signOut();
   showLogin('This account is not an admin.');
   return;
 }
 $('login').classList.add('hidden');
 $('dashboard').classList.remove('hidden');
 loadProducts();
 loadOrders();
}

function showLogin(message=''){
 $('login').classList.remove('hidden');
 $('dashboard').classList.add('hidden');
 $('loginMessage').textContent=message;
}

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 $('loginMessage').textContent='Checking login...';
 const {error}=await db.auth.signInWithPassword({
  email:$('email').value,
  password:$('password').value
 });
 if(error){$('loginMessage').textContent=error.message;return;}
 await checkAdmin();
});

$('logout').onclick=async()=>{
 await db.auth.signOut();
 showLogin('Logged out.');
};

async function loadProducts(){
 const {data,error}=await db.from('products').select('*').order('id',{ascending:false});
 if(error){$('productList').textContent=error.message;return;}
 $('productList').replaceChildren();
 if(!data.length){$('productList').textContent='No products yet.';return;}
 data.forEach(p=>{
  const div=document.createElement('div');
  div.className='item';
  const title=document.createElement('b');
  title.textContent=p.name+' - Rs. '+p.price;
  const btn=document.createElement('button');
  btn.className='danger';
  btn.textContent='Delete';
  btn.onclick=()=>deleteProduct(p.id);
  div.append(title,document.createElement('br'),btn);
  $('productList').append(div);
 });
}

$('productForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const price=Number($('price').value);
 if(!Number.isFinite(price)||price<=0){
  $('productMessage').textContent='Enter a valid price.';
  return;
 }
 const image=$('image').value.trim();
 if(image && !image.startsWith('https://')){
  $('productMessage').textContent='Image URL must start with https://';
  return;
 }
 const {error}=await db.from('products').insert({
  name:$('productName').value.trim(),
  description:$('description').value.trim(),
  price,
  image_url:image||null
 });
 if(error){$('productMessage').textContent=error.message;return;}
 $('productMessage').textContent='Product added!';
 $('productForm').reset();
 loadProducts();
});

async function deleteProduct(id){
 if(!confirm('Delete this product?'))return;
 const {error}=await db.from('products').delete().eq('id',id);
 if(error){alert(error.message);return;}
 loadProducts();
}

async function loadOrders(){
 const {data,error}=await db.from('orders').select('*').order('id',{ascending:false});
 if(error){$('orderList').textContent=error.message;return;}
 $('orderList').replaceChildren();
 if(!data.length){$('orderList').textContent='No orders yet.';return;}
 data.forEach(o=>{
  const div=document.createElement('div');
  div.className='item';
  div.textContent='Order #'+o.id+' | '+o.customer_name+
   ' | '+o.phone+' | Rs. '+o.total+' | '+o.status;
  $('orderList').append(div);
 });
}

checkAdmin();
</script>
</body>
</html>
