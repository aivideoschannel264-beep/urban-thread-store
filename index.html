
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URBAN THREAD | Men's Fashion</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f5f5;color:#171717}
header{background:#111;color:white;padding:20px;text-align:center}
header h1{letter-spacing:4px;margin:5px}
nav{background:#222;padding:12px;text-align:center}
nav a{color:white;text-decoration:none;margin:12px}
.hero{background:#222;color:white;text-align:center;padding:65px 15px}
.hero h2{font-size:35px}
button{background:#111;color:white;border:0;padding:12px 18px;cursor:pointer;border-radius:5px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:25px}
.product{background:white;padding:15px;border-radius:10px;text-align:center}
.product img{width:100%;height:220px;object-fit:cover;border-radius:8px}
.price{font-weight:bold;font-size:20px}
#cart{background:white;margin:20px;padding:20px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
footer{background:#111;color:white;text-align:center;padding:20px}
</style>
</head>
<body>

<header>
<h1>URBAN THREAD</h1>
<p>MEN'S FASHION STORE</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart</a>
</nav>

<section class="hero" id="home">
<h2>STYLE THAT SPEAKS</h2>
<p>Upgrade Your Everyday Fashion</p>
<a href="#products"><button>SHOP NOW</button></a>
</section>

<h2 style="text-align:center" id="products">OUR COLLECTION</h2>

<section class="products">
<div class="product">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="Classic T-shirt">
<h3>Classic T-Shirt</h3>
<p class="price">Rs. 1,499</p>
<button onclick="add('Classic T-Shirt',1499)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500" alt="Men's Jacket">
<h3>Men's Jacket</h3>
<p class="price">Rs. 3,499</p>
<button onclick="add('Men Jacket',3499)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1542272604-787c3835535d?w=500" alt="Men's Jeans">
<h3>Classic Jeans</h3>
<p class="price">Rs. 2,499</p>
<button onclick="add('Classic Jeans',2499)">Add to Cart</button>
</div>
</section>

<section id="cart">
<h2>YOUR CART</h2>
<div id="items">Your cart is empty.</div>
<h3 id="total">Total: Rs. 0</h3>

<h2>Checkout</h2>
<form onsubmit="order(event)">
<input id="name" placeholder="Your Name" required>
<input id="phone" placeholder="Phone Number" required>
<textarea id="address" placeholder="Delivery Address" required></textarea>
<button type="submit">Place Demo Order</button>
</form>
<p id="message"></p>
</section>

<footer>
<p>URBAN THREAD</p>
<p>Men's Fashion | Pakistan</p>
</footer>

<script>
let cart=[];

function add(name,price){
cart.push({name,price});
showCart();
}

function showCart(){
let items=document.getElementById('items');
let total=0;

if(cart.length===0){
items.innerHTML='Your cart is empty.';
}else{
items.innerHTML=cart.map((p,i)=>{
total+=p.price;
return `<p>${p.name} - Rs. ${p.price}
<button onclick="removeItem(${i})">Remove</button></p>`;
}).join('');
}
document.getElementById('total').innerText='Total: Rs. '+total;
}

function removeItem(i){
cart.splice(i,1);
showCart();
}

function order(e){
e.preventDefault();
if(cart.length===0){
alert('Please add a product first.');
return;
}
document.getElementById('message').innerText=
'Demo order prepared! Backend connection is needed to save real orders.';
}
</script>

</body>
</html>
