<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URBAN THREAD | Men's Fashion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f5f5;color:#171717}
header,footer{background:#111;color:white;text-align:center;padding:22px}
header h1{letter-spacing:4px}
nav{background:#222;padding:14px;text-align:center}
nav a{color:white;text-decoration:none;margin:12px}
.hero{background:#222;color:white;text-align:center;padding:55px 15px}
button{background:#111;color:white;border:0;padding:12px 18px;border-radius:5px;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;padding:20px}
.product{background:white;padding:15px;border-radius:10px;text-align:center}
.product img{width:100%;height:220px;object-fit:cover;border-radius:8px}
#cart{background:white;margin:20px;padding:20px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
</style>
</head>

<body>

<header>
<h1>URBAN THREAD</h1>
<p>MEN'S FASHION STORE</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart</a>
</nav>

<section class="hero" id="home">
<h2>STYLE THAT SPEAKS</h2>
<p>Upgrade Your Everyday Fashion</p>
<a href="#products"><button>SHOP NOW</button></a>
</section>

<h2 style="text-align:center" id="products">OUR COLLECTION</h2>
<div id="status" style="text-align:center;padding:10px">Loading products...</div>
<section class="products" id="product-list"></section>

<section id="cart">
<h2>YOUR CART</h2>
<div id="items">Your cart is empty.</div>
<h3 id="total">Total: Rs. 0</h3>

<h2>Checkout</h2>
<form id="checkout">
<input id="name" placeholder="Your Name" required>
<input id="phone" placeholder="Phone Number" required>
<textarea id="address" placeholder="Delivery Address" required></textarea>
<button type="submit" id="orderButton">Place Order</button>
</form>
<p id="message"></p>
</section>

<footer>
<p>URBAN THREAD</p>
<p>Men's Fashion | Pakistan</p>
</footer>

<script>
const SUPABASE_URL = "https://afwikvilbmgmwjcwamzx.supabase.co";
const SUPABASE_KEY = "sb_publishable_FIpEBKTrSW_j3XhTvNIHHQ_pdX8U3AV";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let cart = [];
let products = [];

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function safeImage(url){
  if(!url || !/^https:\/\//i.test(url)){
    return 'https://placehold.co/500x350?text=URBAN+THREAD';
  }
  return escapeHTML(url);
}

async function loadProducts(){
  const status = document.getElementById('status');
  status.textContent = 'Loading products...';

  try{
    const {data,error} = await db
      .from('products')
      .select('*')
      .order('id',{ascending:false});

    if(error){
      status.textContent = 'ERROR: ' + error.message;
      return;
    }

    products = data || [];

    if(products.length === 0){
      status.textContent = 'Abhi koi product add nahi hua.';
      return;
    }

    status.textContent = '';

    document.getElementById('product-list').innerHTML =
      products.map(p => `
        <div class="product">
          <img src="${safeImage(p.image_url)}" alt="Product">
          <h3>${escapeHTML(p.name)}</h3>
          <p>${escapeHTML(p.description || '')}</p>
          <p><b>Rs. ${Number(p.price).toLocaleString('en-PK')}</b></p>
          <button type="button" data-product-id="${escapeHTML(p.id)}">
            Add to Cart
          </button>
        </div>
      `).join('');

  }catch(error){
    status.textContent = 'ERROR: ' + error.message;
  }
}

document.getElementById('product-list').addEventListener('click',e=>{
  const button = e.target.closest('button[data-product-id]');
  if(!button) return;
  addToCart(button.dataset.productId);
});

function addToCart(id){
  const p = products.find(x => String(x.id) === String(id));
  if(!p) return;
  cart.push(p);
  showCart();
}

function showCart(){
  let total = 0;
  const items = document.getElementById('items');

  if(!cart.length){
    items.textContent = 'Your cart is empty.';
  }else{
    items.innerHTML = cart.map((p,i)=>{
      total += Number(p.price);
      return `<p>${escapeHTML(p.name)} - Rs. ${Number(p.price)}
      <button type="button" data-remove="${i}">Remove</button></p>`;
    }).join('');
  }

  document.getElementById('total').textContent =
    'Total: Rs. ' + total.toLocaleString('en-PK');
}

document.getElementById('items').addEventListener('click',e=>{
  const button = e.target.closest('button[data-remove]');
  if(!button) return;

  cart.splice(Number(button.dataset.remove),1);
  showCart();
});

document.getElementById('checkout').addEventListener('submit',async e=>{
  e.preventDefault();

  const message = document.getElementById('message');
  const orderButton = document.getElementById('orderButton');

  if(!cart.length){
    message.textContent = 'Cart empty hai!';
    return;
  }

  orderButton.disabled = true;
  message.textContent = 'Order submit ho raha hai...';

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();

  const total = cart.reduce((sum,p)=>sum + Number(p.price),0);

  try{
    const {data,error} = await db
      .from('orders')
      .insert([{
        customer_name:name,
        phone:phone,
        address:address,
        total:total,
        status:'pending'
      }])
      .select()
      .single();

    if(error){
      message.textContent = 'Order ERROR: ' + error.message;
      return;
    }

    message.textContent = 'Order placed successfully! Order ID: ' + data.id;
    cart = [];
    showCart();
    e.target.reset();

  }catch(error){
    message.textContent = 'ERROR: ' + error.message;
  }finally{
    orderButton.disabled = false;
  }
});

loadProducts();
</script>
</body>
</html>
